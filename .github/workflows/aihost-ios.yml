name: AI-HOST iOS build

# Builds the iOS app (Flutter, Runner scheme) on a macOS runner WITHOUT code signing,
# to prove it compiles with our branding overlay (mobile/ios/Flutter/AppOverrides.xcconfig).
# Signed builds and TestFlight upload come later, once the Apple Distribution certificate,
# provisioning profiles and App Store Connect API key exist as repository secrets.
# Manual only. Run it on `main` or on a release branch (release/desktop-vX.Y.Z-aihost.N).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build. Empty means the branch you run this workflow on."
        required: false
        type: string
      run_tests:
        description: "Also run the mobile tests before building."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ios-unsigned:
    name: Build iOS (unsigned)
    if: github.repository == 'ab2005/ai-host'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Xcode version
        run: xcodebuild -version

      - name: Install Flutter packages
        run: just mobile-install

      - name: Check and test
        if: inputs.run_tests
        run: just mobile-check mobile-test

      - name: Build the app, unsigned
        working-directory: mobile
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=BUZZ_PUSH_GATEWAY_URL=https://push.example

      - name: Check the branding landed in the build
        run: |
          app=mobile/build/ios/iphoneos/Runner.app
          name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Info.plist")
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          echo "display name: $name, bundle id: $id"
          [[ "$name" == "AI-HOST" ]] || { echo "::error::Display name is '$name', expected AI-HOST"; exit 1; }
          [[ "$id" == "ai.new-i.aihost.mobile" ]] || { echo "::error::Bundle id is '$id', expected ai.new-i.aihost.mobile"; exit 1; }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aihost-ios-unsigned
          path: mobile/build/ios/iphoneos/Runner.app
          retention-days: 7
          if-no-files-found: error
