name: AI-HOST release

# Builds AI-HOST from the newest official Buzz Desktop release: the upstream tag
# plus our customization layer replayed on top (brand/scripts/ci/), gated by
# tests, then published to this repository's Releases. Versions are
# desktop-vX.Y.Z-aihost.N, where X.Y.Z is Block's version and N is ours.
#
# Releases are created as DRAFTS (you click Publish) until the repository
# variable AIHOST_AUTO_PUBLISH is set to "true". See FORK.md ("Release pipeline").
#
# Needs the repository secret AIHOST_BOT_TOKEN: a fine-grained token with
# Contents, Workflows, Issues and Actions (read/write) on this repository.
# The default GITHUB_TOKEN cannot push upstream-derived commits that touch
# .github/workflows, and its pushes do not trigger other workflows.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream tag to build, e.g. desktop-v0.5.28. Empty means the newest official release. Setting it always builds, with the next sub-version."
        required: false
        type: string

concurrency:
  group: aihost-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: Detect upstream release
    if: github.repository == 'ab2005/ai-host'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      needed: ${{ steps.detect.outputs.needed }}
      upstream_tag: ${{ steps.detect.outputs.upstream_tag }}
      version: ${{ steps.detect.outputs.version }}
      subversion: ${{ steps.detect.outputs.subversion }}
      release_tag: ${{ steps.detect.outputs.release_tag }}
    env:
      GH_TOKEN: ${{ secrets.AIHOST_BOT_TOKEN }}
    steps:
      - name: Require the bot token
        run: |
          [[ -n "$GH_TOKEN" ]] || { echo "::error::Repository secret AIHOST_BOT_TOKEN is missing (see FORK.md, Release pipeline)"; exit 1; }
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Detect
        id: detect
        env:
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: brand/scripts/ci/detect-upstream.sh

  build:
    name: Build, test and package
    needs: detect
    if: needs.detect.outputs.needed == 'true'
    runs-on: macos-latest
    timeout-minutes: 150
    outputs:
      branch: ${{ steps.source.outputs.branch }}
      sha: ${{ steps.source.outputs.sha }}
    env:
      GH_TOKEN: ${{ secrets.AIHOST_BOT_TOKEN }}
      UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
      VERSION: ${{ needs.detect.outputs.version }}
      SUBVERSION: ${{ needs.detect.outputs.subversion }}
      RELEASE_TAG: ${{ needs.detect.outputs.release_tag }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          token: ${{ secrets.AIHOST_BOT_TOKEN }}

      - name: Git identity
        run: |
          git config user.name "aihost-release[bot]"
          git config user.email "aihost-release@users.noreply.github.com"

      - name: Build release source (upstream tag + our layer)
        id: source
        run: brand/scripts/ci/build-release-branch.sh

      - name: Report a conflict
        if: failure() && steps.source.outcome == 'failure'
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Release blocked: our changes conflict with $UPSTREAM_TAG" \
            --body-file "$RUNNER_TEMP/aihost-conflicts.md"

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: |
            .
            desktop/src-tauri

      - name: Gate (brand check, desktop, Rust, mobile tests)
        run: brand/scripts/gate.sh

      - name: Build AI-HOST.app
        run: brand/scripts/build-desktop.sh

      - name: Package
        env:
          BUILD_NUMBER: ${{ env.SUBVERSION }}
        run: |
          brand/scripts/package-macos.sh \
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/AI-HOST.app \
            dist "${VERSION}-aihost.${SUBVERSION}"

      - name: Push release source
        run: git push --force origin "HEAD:refs/heads/${{ steps.source.outputs.branch }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aihost-macos
          path: dist/*
          retention-days: 14
          if-no-files-found: error

      - name: Report a failed gate or build
        if: failure() && steps.source.outcome != 'failure'
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Release $RELEASE_TAG failed its checks" \
            --body "The gate or build failed for upstream $UPSTREAM_TAG. Nothing was published. Logs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  publish:
    name: Create release
    needs: [detect, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.AIHOST_BOT_TOKEN }}
      UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
      VERSION: ${{ needs.detect.outputs.version }}
      SUBVERSION: ${{ needs.detect.outputs.subversion }}
      RELEASE_TAG: ${{ needs.detect.outputs.release_tag }}
      SOURCE_SHA: ${{ needs.build.outputs.sha }}
      AUTO_PUBLISH: ${{ vars.AIHOST_AUTO_PUBLISH }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aihost-macos
          path: dist

      - name: Write release notes
        run: |
          {
            echo "AI-HOST ${VERSION} (build ${SUBVERSION}), based on Block's official Buzz Desktop ${VERSION}."
            echo
            echo "Upstream release: https://github.com/block/buzz/releases/tag/${UPSTREAM_TAG}"
            echo
            echo "**Install:** open the .dmg and drag AI-HOST to Applications. This build is not yet signed with a Developer ID, so macOS may block the first launch: open System Settings, then Privacy & Security, then choose Open Anyway. Apple silicon (arm64) only."
            echo
            echo "What's new upstream (from Block's release notes):"
            gh api "repos/block/buzz/releases/tags/${UPSTREAM_TAG}" --jq '.body' \
              | grep -iE '^[-*] .*(feat|fix)' | head -30 || echo "(see the upstream release)"
            echo
            echo "SHA-256:"
            echo '```'
            cat dist/*.sha256
            echo '```'
          } > notes.md

      - name: Create the release
        run: |
          draft=(--draft)
          [[ "$AUTO_PUBLISH" == "true" ]] && draft=()
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.dmg dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "AI-HOST ${VERSION} (build ${SUBVERSION})" \
            --notes-file notes.md \
            ${draft[@]+"${draft[@]}"}
